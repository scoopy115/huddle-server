[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "huddle-server"
version = "0.1.0"
description = "Self-hosted processing server for Huddle: transcription, speaker separation and notes on your own machine."
readme = "../README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "huddle-engine>=0.9.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "argon2-cffi>=23.1",
  "pyotp>=2.9",
  "qrcode>=7.4",
  "cryptography>=42",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
huddle-server = "huddle_server.__main__:main"

[tool.setuptools.packages.find]
include = ["huddle_server*"]

[tool.setuptools.package-data]
huddle_server = ["static/**/*"]

[tool.ruff]
line-length = 130
target-version = "py311"
