name: image
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      engine_ref:
        description: Huddle repo ref for the engine
        default: main
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch engine
        env:
          HUDDLE_REPO_TOKEN: ${{ secrets.HUDDLE_REPO_TOKEN }}
        run: scripts/fetch-engine.sh --git "${{ github.event.inputs.engine_ref || 'main' }}"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      # Optional: a Docker Hub login lifts the anonymous pull-rate limit for anything not mirrored.
      - if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with: { username: "${{ secrets.DOCKERHUB_USERNAME }}", password: "${{ secrets.DOCKERHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
